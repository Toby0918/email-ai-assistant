name: R2 Git-object Provenance

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  portable-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      receipt: ${{ steps.provenance.outputs.receipt }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - name: Install exact dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r requirements-ci-linux.lock"
      - name: Verify portable Git-object provenance
        id: provenance
        env:
          R2_CI_PROVENANCE_KIND: portable
        run: |
          receipt="$(python -B scripts/verify_r2_ci_provenance.py)"
          printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"

  windows-native-provenance:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      receipt: ${{ steps.provenance.outputs.receipt }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install hash-locked Python 3.12.13
        shell: pwsh
        run: |
          $pythonArchive = Join-Path $env:RUNNER_TEMP "cpython-3.12.13-windows-x86_64.tar.gz"
          $sqliteArchive = Join-Path $env:RUNNER_TEMP "sqlite-dll-win-x64-3500400.zip"
          $sqliteExtract = Join-Path $env:RUNNER_TEMP "sqlite-dll-win-x64-3500400"
          $runtime = Join-Path $env:RUNNER_TEMP "cpython-3.12.13-windows-x86_64"
          if (
            (Test-Path -LiteralPath $pythonArchive) -or
            (Test-Path -LiteralPath $sqliteArchive) -or
            (Test-Path -LiteralPath $sqliteExtract) -or
            (Test-Path -LiteralPath $runtime)
          ) {
            throw "R2_CI_PYTHON_PATH_NOT_EMPTY"
          }
          Invoke-WebRequest -Uri "https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.12.13%2B20260718-x86_64-pc-windows-msvc-install_only.tar.gz" -OutFile $pythonArchive
          $actualSha256 = (Get-FileHash -LiteralPath $pythonArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne "56c9dd9681c4810cb8bfdec277ee2606d8ab17e678e5bc2bd138eb8098e330b6") {
            throw "R2_CI_PYTHON_HASH_MISMATCH"
          }
          New-Item -ItemType Directory -Path $runtime -ErrorAction Stop | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xzf $pythonArchive -C $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $runtime "python\python.exe"
          Invoke-WebRequest -Uri "https://www.sqlite.org/2025/sqlite-dll-win-x64-3500400.zip" -OutFile $sqliteArchive
          $actualSqliteSha3 = (& $python -I -B -c "import hashlib,pathlib; print(hashlib.sha3_256(pathlib.Path(r'$sqliteArchive').read_bytes()).hexdigest())").Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actualSqliteSha3 -ne "8454a8ef362b4b2d5a259a54948ed278ef943128bf1ba74b5cbd87ebc58e5b85") {
            throw "R2_CI_SQLITE_HASH_MISMATCH"
          }
          New-Item -ItemType Directory -Path $sqliteExtract -ErrorAction Stop | Out-Null
          Expand-Archive -LiteralPath $sqliteArchive -DestinationPath $sqliteExtract
          $sqliteDll = Join-Path $sqliteExtract "sqlite3.dll"
          $bundledSqliteDll = Join-Path $runtime "python\DLLs\sqlite3.dll"
          $bundledSqliteHold = Join-Path $env:RUNNER_TEMP "sqlite3-as-shipped.dll"
          if (
            -not (Test-Path -LiteralPath $sqliteDll -PathType Leaf) -or
            -not (Test-Path -LiteralPath $bundledSqliteDll -PathType Leaf) -or
            (Test-Path -LiteralPath $bundledSqliteHold)
          ) {
            throw "R2_CI_SQLITE_PATH_INVALID"
          }
          Move-Item -LiteralPath $bundledSqliteDll -Destination $bundledSqliteHold -ErrorAction Stop
          Copy-Item -LiteralPath $sqliteDll -Destination $bundledSqliteDll -ErrorAction Stop
          & $python -I -B -c 'import sqlite3,sys; raise SystemExit(0 if sys.version_info[:3] == (3, 12, 13) and sqlite3.sqlite_version_info == (3, 50, 4) else 1)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -m pip --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Split-Path -Parent $python) >> $env:GITHUB_PATH
      - name: Install exact dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r requirements-ci-windows.lock"
      - name: Probe remaining Windows-native fixed-suite ordinal
        shell: pwsh
        run: |
          $probeCodeText = python -B tests/r2_windows_native_diagnostic.py
          if ($LASTEXITCODE -ne 0) {
            Write-Output "R2_WINDOWS_NATIVE_PROBE_241"
            exit 1
          }
          if (
            [string]::IsNullOrWhiteSpace([string]$probeCodeText) -or
            $probeCodeText -is [array]
          ) {
            Write-Output "R2_WINDOWS_NATIVE_PROBE_242"
            exit 1
          }
          $probeCode = 0
          if (-not [int]::TryParse([string]$probeCodeText, [ref]$probeCode)) {
            Write-Output "R2_WINDOWS_NATIVE_PROBE_243"
            exit 1
          }
          if ($probeCode -lt 0 -or $probeCode -gt 250) {
            Write-Output "R2_WINDOWS_NATIVE_PROBE_244"
            exit 1
          }
          if ($probeCode -ne 0) {
            Write-Output ("R2_WINDOWS_NATIVE_PROBE_{0:D3}" -f $probeCode)
            exit 1
          }
      - name: Verify Windows native Git-object provenance
        id: provenance
        shell: pwsh
        env:
          R2_CI_PROVENANCE_KIND: windows_native
        run: |
          $receipt = python -B scripts/verify_r2_ci_provenance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "receipt=$receipt" >> $env:GITHUB_OUTPUT

  windows-independent-provenance:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      receipt: ${{ steps.provenance.outputs.receipt }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install hash-locked Python 3.12.13
        shell: pwsh
        run: |
          $pythonArchive = Join-Path $env:RUNNER_TEMP "cpython-3.12.13-windows-x86_64.tar.gz"
          $sqliteArchive = Join-Path $env:RUNNER_TEMP "sqlite-dll-win-x64-3500400.zip"
          $sqliteExtract = Join-Path $env:RUNNER_TEMP "sqlite-dll-win-x64-3500400"
          $runtime = Join-Path $env:RUNNER_TEMP "cpython-3.12.13-windows-x86_64"
          if (
            (Test-Path -LiteralPath $pythonArchive) -or
            (Test-Path -LiteralPath $sqliteArchive) -or
            (Test-Path -LiteralPath $sqliteExtract) -or
            (Test-Path -LiteralPath $runtime)
          ) {
            throw "R2_CI_PYTHON_PATH_NOT_EMPTY"
          }
          Invoke-WebRequest -Uri "https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.12.13%2B20260718-x86_64-pc-windows-msvc-install_only.tar.gz" -OutFile $pythonArchive
          $actualSha256 = (Get-FileHash -LiteralPath $pythonArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne "56c9dd9681c4810cb8bfdec277ee2606d8ab17e678e5bc2bd138eb8098e330b6") {
            throw "R2_CI_PYTHON_HASH_MISMATCH"
          }
          New-Item -ItemType Directory -Path $runtime -ErrorAction Stop | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xzf $pythonArchive -C $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $runtime "python\python.exe"
          Invoke-WebRequest -Uri "https://www.sqlite.org/2025/sqlite-dll-win-x64-3500400.zip" -OutFile $sqliteArchive
          $actualSqliteSha3 = (& $python -I -B -c "import hashlib,pathlib; print(hashlib.sha3_256(pathlib.Path(r'$sqliteArchive').read_bytes()).hexdigest())").Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actualSqliteSha3 -ne "8454a8ef362b4b2d5a259a54948ed278ef943128bf1ba74b5cbd87ebc58e5b85") {
            throw "R2_CI_SQLITE_HASH_MISMATCH"
          }
          New-Item -ItemType Directory -Path $sqliteExtract -ErrorAction Stop | Out-Null
          Expand-Archive -LiteralPath $sqliteArchive -DestinationPath $sqliteExtract
          $sqliteDll = Join-Path $sqliteExtract "sqlite3.dll"
          $bundledSqliteDll = Join-Path $runtime "python\DLLs\sqlite3.dll"
          $bundledSqliteHold = Join-Path $env:RUNNER_TEMP "sqlite3-as-shipped.dll"
          if (
            -not (Test-Path -LiteralPath $sqliteDll -PathType Leaf) -or
            -not (Test-Path -LiteralPath $bundledSqliteDll -PathType Leaf) -or
            (Test-Path -LiteralPath $bundledSqliteHold)
          ) {
            throw "R2_CI_SQLITE_PATH_INVALID"
          }
          Move-Item -LiteralPath $bundledSqliteDll -Destination $bundledSqliteHold -ErrorAction Stop
          Copy-Item -LiteralPath $sqliteDll -Destination $bundledSqliteDll -ErrorAction Stop
          & $python -I -B -c 'import sqlite3,sys; raise SystemExit(0 if sys.version_info[:3] == (3, 12, 13) and sqlite3.sqlite_version_info == (3, 50, 4) else 1)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -m pip --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Split-Path -Parent $python) >> $env:GITHUB_PATH
      - name: Install exact dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r requirements-ci-windows.lock"
      - name: Verify independent Windows process provenance
        id: provenance
        shell: pwsh
        env:
          R2_CI_PROVENANCE_KIND: windows_independent
        run: |
          $receipt = python -B scripts/verify_r2_ci_provenance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "receipt=$receipt" >> $env:GITHUB_OUTPUT

  provenance-reconciliation:
    needs:
      - portable-provenance
      - windows-native-provenance
      - windows-independent-provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - name: Reconcile exact same-package receipts
        env:
          R2_PORTABLE_PROVENANCE_RECEIPT: ${{ needs.portable-provenance.outputs.receipt }}
          R2_WINDOWS_NATIVE_PROVENANCE_RECEIPT: ${{ needs.windows-native-provenance.outputs.receipt }}
          R2_WINDOWS_INDEPENDENT_PROVENANCE_RECEIPT: ${{ needs.windows-independent-provenance.outputs.receipt }}
        run: python -B scripts/reconcile_r2_ci_provenance.py
