name: Agent Guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality-gates:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"

      - name: Show runtime versions
        run: |
          python --version
          python - <<'PY'
          import sqlite3
          print("sqlite runtime:", sqlite3.sqlite_version)
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run architecture guardrails
        run: python -m unittest discover -s tests -p "test_architecture_constraints.py"

      - name: Run static linter guardrails
        run: python -m unittest discover -s tests -p "test_static_linter_constraints.py"

      - name: Run mechanical rule guardrails
        run: python -m unittest discover -s tests -p "test_mechanical_rule_constraints.py"

      - name: Run full test suite
        run: python -m unittest discover -s tests

      - name: Run maintenance scan
        run: python scripts/maintenance_scan.py --fail-on-high
